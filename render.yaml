# Despliegue en Render con un clic (Blueprint). La base de datos vive en el disco persistente.
services:
  - type: web
    name: topreview
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/public/info
    disk:
      name: topreview-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATA_DIR
        value: /var/data
      - key: BUSINESS_NAME
        value: POLKA San Sebastián
      - key: GOOGLE_REVIEW_URL
        value: https://www.google.com/maps/search/?api=1&query=POLKA+San+Sebasti%C3%A1n+Plaza+Sarriegi+7+Donostia
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
